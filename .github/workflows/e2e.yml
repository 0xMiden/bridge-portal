name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast, deterministic, every-PR: unit tier + mock e2e tier. No secrets, no
  # real network (the injected signers + stubbed endpoints keep it hermetic).
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mock-results
          path: test-results/
          retention-days: 7
