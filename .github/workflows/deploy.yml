name: deploy

# Ship the Worker only after live testnet E2E (or its skip-until-secrets path)
# succeeded on main. That workflow itself waits on `ci`, so a red mock suite
# never reaches here.
on:
  workflow_run:
    workflows: [e2e-testnet]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production Cloudflare build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_APP_URL: https://bridge.miden.xyz
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      - name: Refuse E2E secrets in the production bundle
        run: node scripts/check-prod-bundle.mjs
      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Canary production health
        run: |
          sleep 15
          curl -fsS --max-time 30 https://bridge.miden.xyz/health
          echo
          code=$(curl -sS -o /tmp/deep.json -w '%{http_code}' --max-time 30 \
            https://bridge.miden.xyz/health/deep || true)
          echo "deep HTTP $code"
          cat /tmp/deep.json 2>/dev/null || true
          echo
          if [ "$code" = "404" ]; then
            echo "deep health not on this Worker yet (first ops deploy); liveness passed"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            exit 1
          fi
