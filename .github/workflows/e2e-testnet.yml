name: e2e-testnet

# Live Sepolia + Miden testnet. Runs after `ci` is green on main so we never
# spend a funded-key run (or a production deploy) on a red mock suite. One
# funded key: serialize and do not cancel an in-flight run.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-testnet-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-failed:
    name: refuse failed ci
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ci concluded ${{ github.event.workflow_run.conclusion }}; not running live testnet"
          exit 1

  testnet:
    name: live testnet
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      E2E_NETWORK: testnet
      E2E_EVM_PRIVATE_KEY: ${{ secrets.E2E_EVM_PRIVATE_KEY }}
      E2E_MIDEN_SEED: ${{ secrets.E2E_MIDEN_SEED }}
      E2E_MIDEN_ACCOUNT_ID: ${{ secrets.E2E_MIDEN_ACCOUNT_ID }}
      E2E_MIDEN_ACCOUNT_FILE: ${{ secrets.E2E_MIDEN_ACCOUNT_FILE }}
      E2E_SEPOLIA_RPC_URL: ${{ secrets.E2E_SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Skip when secrets are not configured
        id: secrets
        run: |
          if [ -z "$E2E_EVM_PRIVATE_KEY" ] || [ -z "$E2E_MIDEN_ACCOUNT_ID" ]; then
            echo "E2E_EVM_PRIVATE_KEY / E2E_MIDEN_ACCOUNT_ID not set. Add repo secrets to enable live testnet E2E."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.skip != 'true'
        run: npm ci
      - if: steps.secrets.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.secrets.outputs.skip != 'true'
        run: npm run test:e2e:testnet
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testnet-results
          path: test-results/
          retention-days: 7
